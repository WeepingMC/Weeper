name: Update Paper

on:
  schedule:
    # Every Monday at 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: update-paper
  cancel-in-progress: false

jobs:
  open-update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Check for a newer Paper commit
        id: paper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current=$(sed -n 's/^paperRef=//p' gradle.properties)
          latest=$(gh api repos/PaperMC/Paper/commits/main --jq '.sha')

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          existing=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --state open \
            --json number,headRefName,headRefOid,url \
            --jq 'first(.[] | select(.headRefName | startswith("automation/paper-")) | [.number, .headRefName, .headRefOid, .url] | @tsv) // empty')
          if [[ -n "$existing" ]]; then
            IFS=$'\t' read -r number branch head_sha url <<< "$existing"
            pr_ref=$(gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/contents/gradle.properties" \
              -f ref="$branch" \
              --jq '.content' \
              | base64 --decode \
              | sed -n 's/^paperRef=//p')
            echo "Resuming existing Paper update PR: $url"
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "existing=true" >> "$GITHUB_OUTPUT"
            echo "number=$number" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "latest=$pr_ref" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$current" == "$latest" ]]; then
            echo "Paper is already at $latest"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "update=true" >> "$GITHUB_OUTPUT"
          echo "existing=false" >> "$GITHUB_OUTPUT"

      - name: Create update branch and pull request
        if: steps.paper.outputs.update == 'true' && steps.paper.outputs.existing != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_REF: ${{ steps.paper.outputs.current }}
          LATEST_REF: ${{ steps.paper.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail

          branch="automation/paper-${LATEST_REF:0:12}-${GITHUB_RUN_ID}"
          changes=$(gh api \
            --paginate \
            "repos/PaperMC/Paper/compare/$CURRENT_REF...$LATEST_REF" \
            --jq '.commits[].commit.message | split("\n")[0]')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          sed -i "s/^paperRef=.*/paperRef=$LATEST_REF/" gradle.properties
          git add gradle.properties
          {
            echo "Update Paper to ${LATEST_REF:0:12}"
            echo
            printf '%s\n' "$changes"
          } > commit-message.txt
          git commit --file commit-message.txt --cleanup=verbatim
          head_sha=$(git rev-parse HEAD)
          git push --set-upstream origin "$branch"

          {
            echo "Updates \`paperRef\` from [\`${CURRENT_REF:0:12}\`](https://github.com/PaperMC/Paper/commit/$CURRENT_REF) to [\`${LATEST_REF:0:12}\`](https://github.com/PaperMC/Paper/commit/$LATEST_REF)."
            echo
            echo "The **Patch and Build** workflow must succeed before this pull request is squash-merged."
            echo
            echo "### Upstream changes"
            echo
            printf '%s\n' "$changes" | sed 's/^/- /'
          } > pull-request.md

          pr_url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "Update Paper to ${LATEST_REF:0:12}" \
            --body-file pull-request.md)

          echo "number=${pr_url##*/}" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Add upstream changes to existing pull request
        if: steps.paper.outputs.existing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_REF: ${{ steps.paper.outputs.current }}
          LATEST_REF: ${{ steps.paper.outputs.latest }}
          PR_NUMBER: ${{ steps.paper.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          changes=$(gh api \
            --paginate \
            "repos/PaperMC/Paper/compare/$CURRENT_REF...$LATEST_REF" \
            --jq '.commits[].commit.message | split("\n")[0]')
          {
            echo "Updates \`paperRef\` from [\`${CURRENT_REF:0:12}\`](https://github.com/PaperMC/Paper/commit/$CURRENT_REF) to [\`${LATEST_REF:0:12}\`](https://github.com/PaperMC/Paper/commit/$LATEST_REF)."
            echo
            echo "The **Patch and Build** workflow must succeed before this pull request is squash-merged."
            echo
            echo "### Upstream changes"
            echo
            printf '%s\n' "$changes" | sed 's/^/- /'
          } > pull-request.md
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file pull-request.md

      - name: Dispatch and wait for Patch and Build
        if: steps.paper.outputs.update == 'true'
        id: build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ steps.pr.outputs.branch || steps.paper.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          previous_run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build.yml \
            --branch "$HEAD_BRANCH" \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          # Pushes authenticated with GITHUB_TOKEN do not trigger push workflows.
          # A workflow_dispatch event does, without requiring a separate PAT.
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"

          run_id=""
          for attempt in {1..24}; do
            candidate=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow build.yml \
              --branch "$HEAD_BRANCH" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [[ -n "$candidate" && "$candidate" != "$previous_run_id" ]]; then
              run_id=$candidate
              break
            fi
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo "The dispatched Patch and Build run did not appear" >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Squash-merge successful update
        if: steps.paper.outputs.update == 'true' && steps.build.outcome == 'success'
        id: merge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number || steps.paper.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha || steps.paper.outputs.head_sha }}
          CURRENT_REF: ${{ steps.paper.outputs.current }}
          LATEST_REF: ${{ steps.paper.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail
          touch merge-result.txt
          changes=$(gh api \
            --paginate \
            "repos/PaperMC/Paper/compare/$CURRENT_REF...$LATEST_REF" \
            --jq '.commits[].commit.message | split("\n")[0]')
          printf '%s\n' "$changes" > squash-message.txt
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA" \
            --subject "Update Paper to ${LATEST_REF:0:12}" \
            --body-file squash-message.txt 2>&1 | tee merge-result.txt

      - name: Comment when the update cannot be merged
        if: steps.build.outcome == 'success' && steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number || steps.paper.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          merge_state=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json mergeStateStatus \
            --jq '.mergeStateStatus')
          {
            echo "<!-- paper-update-merge-failure -->"
            echo "The build pipeline succeeded, but the automatic squash merge could not be completed."
            echo
            echo "GitHub reports the merge state as **$merge_state**. This commonly means the branch conflicts with \`main\` or another repository rule is blocking the merge."
            echo
            echo '```text'
            tail -c 50000 merge-result.txt
            echo
            echo '```'
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          exit 1

      - name: Comment with failed build output
        if: steps.paper.outputs.update == 'true' && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number || steps.paper.outputs.number }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$RUN_ID" ]]; then
            run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            conclusion=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > failed-steps.log 2>&1 || true
          else
            run_url="https://github.com/$GITHUB_REPOSITORY/actions/workflows/build.yml"
            conclusion="dispatch failure"
            echo "The Patch and Build run could not be found after it was dispatched." > failed-steps.log
          fi
          {
            echo "<!-- paper-update-build-failure -->"
            echo "The [Patch and Build run]($run_url) finished with status **$conclusion**, so this update was not merged."
            echo
            echo "Failed-step output (including the result of \`applyAllPatches\` when that task failed):"
            echo
            echo '```text'
            tail -c 50000 failed-steps.log
            echo
            echo '```'
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          exit 1
