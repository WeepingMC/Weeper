name: Update Paper

on:
  schedule:
    # Every Monday at 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: ["Patch and Build"]
    types: [completed]
    branches:
      - "automation/paper-*"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-paper
  cancel-in-progress: false

jobs:
  open-update:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Check for a newer Paper commit
        id: paper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current=$(sed -n 's/^paperRef=//p' gradle.properties)
          latest=$(gh api repos/PaperMC/Paper/commits/main --jq '.sha')

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          if [[ "$current" == "$latest" ]]; then
            echo "Paper is already at $latest"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --state open \
            --json headRefName,url \
            --jq 'first(.[] | select(.headRefName | startswith("automation/paper-")) | .url) // empty')
          if [[ -n "$existing" ]]; then
            echo "A Paper update PR is already open: $existing"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "update=true" >> "$GITHUB_OUTPUT"

      - name: Create update branch and pull request
        if: steps.paper.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_REF: ${{ steps.paper.outputs.current }}
          LATEST_REF: ${{ steps.paper.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail

          branch="automation/paper-${LATEST_REF:0:12}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          sed -i "s/^paperRef=.*/paperRef=$LATEST_REF/" gradle.properties
          git add gradle.properties
          git commit -m "Update Paper to ${LATEST_REF:0:12}"
          git push --set-upstream origin "$branch"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "Update Paper to ${LATEST_REF:0:12}" \
            --body "Updates \`paperRef\` from [\`${CURRENT_REF:0:12}\`](https://github.com/PaperMC/Paper/commit/$CURRENT_REF) to [\`${LATEST_REF:0:12}\`](https://github.com/PaperMC/Paper/commit/$LATEST_REF).

          The **Patch and Build** workflow must succeed before this pull request is squash-merged."

          # Pushes authenticated with GITHUB_TOKEN do not trigger push workflows.
          # A workflow_dispatch event does, without requiring a separate PAT.
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  finish-update:
    # Only trust builds explicitly dispatched by this updater. In particular,
    # never auto-merge a similarly named branch from a forked pull request.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.actor.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Find the update pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail

          # Allow for API/eventual-consistency delay between PR creation and
          # this completion handler.
          for attempt in {1..12}; do
            number=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$HEAD_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty')
            if [[ -n "$number" ]]; then
              echo "number=$number" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done

          echo "No open pull request found for $HEAD_BRANCH" >&2
          exit 1

      - name: Squash-merge successful update
        if: github.event.workflow_run.conclusion == 'success'
        id: merge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -o pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA" 2>&1 | tee merge-result.txt

      - name: Comment when the update cannot be merged
        if: github.event.workflow_run.conclusion == 'success' && steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          merge_state=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json mergeStateStatus \
            --jq '.mergeStateStatus')
          {
            echo "<!-- paper-update-merge-failure -->"
            echo "The build pipeline succeeded, but the automatic squash merge could not be completed."
            echo
            echo "GitHub reports the merge state as **$merge_state**. This commonly means the branch conflicts with \`main\` or another repository rule is blocking the merge."
            echo
            echo '```text'
            tail -c 50000 merge-result.txt
            echo
            echo '```'
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md

      - name: Comment with failed build output
        if: github.event.workflow_run.conclusion != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail

          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > failed-steps.log 2>&1 || true
          {
            echo "<!-- paper-update-build-failure -->"
            echo "The [Patch and Build run]($RUN_URL) finished with status **$CONCLUSION**, so this update was not merged."
            echo
            echo "Failed-step output (including the result of \`applyAllPatches\` when that task failed):"
            echo
            echo '```text'
            tail -c 50000 failed-steps.log
            echo
            echo '```'
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
